worker_processes auto;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Map for WebSocket upgrade header
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Local Node.js API server (started by start.sh alongside nginx)
    upstream api {
        server 127.0.0.1:3001;
    }

    server {
        listen 80 default_server;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Proxy REST API and WebSocket connections to the local Node.js server.
        # Using a single pod removes the separate server pod that was expiring.
        # EXPO_PUBLIC_ROOM_API_URL should be left unset (defaults to '') so that
        # the frontend uses relative paths (/rooms/...) which nginx proxies here.
        location /rooms {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
        }

        location / { try_files $uri $uri/ /index.html; }
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
        location = /index.html { add_header Cache-Control "no-cache"; }
    }
}
