version: '1'

pods:
  - name: app
    dockerfile: Dockerfile
    build_context: .
    port: 80
    health_check:
      path: /health
      interval_seconds: 30
      timeout_seconds: 10
    env_vars:
      - name: EXPO_PUBLIC_API_URL
        description: "Strapi backend URL (e.g. https://backend.myapp.pods.alphinium.io). Leave blank to run without a backend."
      - name: EXPO_PUBLIC_APP_NAME
        description: "App display name shown in the UI"
      - name: EXPO_PUBLIC_ADMIN_EMAILS
        description: "Comma-separated emails that get access to the Add-ons screen in-app"
      - name: EXPO_PUBLIC_OAUTH_PROVIDERS
        description: "Enabled OAuth providers (e.g. google,email). Defaults to google,email"
      - name: EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY
        description: "Stripe publishable key for payment features (optional)"
      - name: EXPO_PUBLIC_WS_HOST
        description: "WebSocket game server host (no protocol prefix, e.g. server.myapp.pods.alphinium.io). Defaults to localhost:3001 for local dev."

  - name: server
    dockerfile: server/Dockerfile
    build_context: server
    port: 3001
    health_check:
      path: /health
      interval_seconds: 30
      timeout_seconds: 10
    env_vars:
      - name: SERVER_SELF_URL
        description: "Public base URL of this server pod (e.g. https://...-server.user-pods.alphinium.io). Used by the keep-alive ping to traverse the proxy on a real application route and prevent pod expiry. Set this (or EXPO_PUBLIC_ROOM_API_URL below) so keep-alive is proxy-aware from boot."
      - name: EXPO_PUBLIC_ROOM_API_URL
        description: "Same server base URL as above. If set here as well as on the app pod, the keep-alive can use it as a fallback so only one URL variable needs to be configured for both purposes."
      - name: KEEP_ALIVE_INTERVAL_MS
        description: "Keep-alive ping interval in milliseconds (default: 50000). Set to 0 to disable."
