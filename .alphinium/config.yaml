version: '1'

pods:
  - name: app
    dockerfile: Dockerfile
    build_context: .
    port: 80
    health_check:
      path: /health
      interval_seconds: 30
      timeout_seconds: 10
    env_vars:
      - name: EXPO_PUBLIC_API_URL
        description: "Strapi backend URL (e.g. https://backend.myapp.pods.alphinium.io). Leave blank to run without a backend."
      - name: EXPO_PUBLIC_APP_NAME
        description: "App display name shown in the UI"
      - name: EXPO_PUBLIC_ADMIN_EMAILS
        description: "Comma-separated emails that get access to the Add-ons screen in-app"
      - name: EXPO_PUBLIC_OAUTH_PROVIDERS
        description: "Enabled OAuth providers (e.g. google,email). Defaults to google,email"
      - name: EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY
        description: "Stripe publishable key for payment features (optional)"
      - name: EXPO_PUBLIC_ROOM_API_URL
        description: "Server pod public URL (e.g. https://...-server.user-pods.alphinium.io). REQUIRED in two-pod deployments: nginx proxies /rooms to this URL and pings it every 50s to prevent the server pod from expiring. Leave blank for single-pod local dev (embedded Node.js is used instead)."

  - name: server
    dockerfile: server/Dockerfile
    build_context: server
    port: 3001
    health_check:
      path: /health
      interval_seconds: 30
      timeout_seconds: 10
    env_vars:
      - name: FRONTEND_ORIGIN
        description: "CORS allowed origin — set to the app pod URL (e.g. https://...-preview-N-XXXX.user-pods.alphinium.io). Leave blank to allow all origins."
      - name: SERVER_SELF_URL
        description: "This pod's own public URL (e.g. https://...-server.user-pods.alphinium.io). Used by the self-ping keep-alive so the pod stays alive from boot. If not set, the URL is auto-detected from the first incoming request — optional but recommended."
